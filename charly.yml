charly-image:
    candy:
        description: |-
            Concept candy owning the charly-image kind-authoring skills (image/layer schema). Owns its family's `skill:` kind entities (sibling nodes in this file) — the
            the plugins→candies migration; candy/plugin-marketplace regenerates the marketplace
            corpus (the standalone opencharly/marketplace repo) from them.
        plan:
            - run: this documentation-only candy ships no install content (it carries the family's skill/hook/marketplace entities); validate-satisfying no-op
              command: "true"
              context:
                - build
            - check: the image concept candy's skill entities are present and generated into the marketplace's image/skills
              id: charly-image-present
              context:
                - build
              command: "true"
image-skill:
    skill:
        name: image
        family: image
        owner: charly-image
        description: |-
            The `charly box` command family, box definitions in charly.yml, box inheritance, defaults, platforms, builder configuration, the box dependency graph, or the build/deploy scope boundary.

        triggers:
            - "Editing a box (`box/<name>/charly.yml` \u2014 boxes live in the `box/<distro>` submodules; main owns none), box composition"
layer-skill:
    skill:
        name: layer
        family: image
        owner: charly-image
        description: |-
            Candy authoring, charly.yml, plan steps, pixi.toml, package.json, Cargo.toml, or any file under candy/. The authoritative reference for the plan-step verb catalog (`run:`/`check:` steps), `var:` substitution, execution order, and per-verb validation.

        triggers:
            - "Editing a candy (`candy/<name>/charly.yml`), candy authoring, candy tasks/services"
